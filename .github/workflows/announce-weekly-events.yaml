name: Announce Weekly Events Post

on:
  push:
    branches:
      - main
    paths:
      - 'src/content/post/*-weekly-space-coast-tech-events.mdx'
  workflow_dispatch:
    inputs:
      post_date:
        description: 'Post date to announce, in YYYY-MM-DD format'
        required: true
        type: string
      target:
        description: 'Where to post the announcement'
        required: true
        default: all
        type: choice
        options:
          - all
          - facebook
          - bluesky
          - x
          - discord

permissions:
  contents: read

jobs:
  announce:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find weekly post
        id: post
        env:
          EVENT_NAME: ${{ github.event_name }}
          POST_DATE: ${{ inputs.post_date }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if ! [[ "$POST_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "post_date must use YYYY-MM-DD format" >&2
              exit 1
            fi
            POST_FILE="src/content/post/${POST_DATE}-weekly-space-coast-tech-events.mdx"
          else
            POST_FILE="$(git diff --name-only --diff-filter=A "$BEFORE_SHA" "$AFTER_SHA" -- 'src/content/post/*-weekly-space-coast-tech-events.mdx' | sort | tail -n 1)"
          fi

          if [ -z "$POST_FILE" ] || [ ! -f "$POST_FILE" ]; then
            echo "No weekly event post found to announce." >&2
            exit 1
          fi

          POST_DATE="$(basename "$POST_FILE" | sed -E 's/^([0-9]{4}-[0-9]{2}-[0-9]{2})-.*/\1/')"
          echo "url=https://space-coast.dev/posts/${POST_DATE}/weekly-space-coast-tech-events" >> "$GITHUB_OUTPUT"

      - name: Post to Facebook
        id: post-facebook
        if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'facebook'
        continue-on-error: true
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          POST_URL: ${{ steps.post.outputs.url }}
        run: |
          if [ -z "$FACEBOOK_PAGE_ACCESS_TOKEN" ] || [ -z "$FACEBOOK_PAGE_ID" ]; then
            echo "Facebook posting is not configured; skipping."
            exit 0
          fi

          curl --fail-with-body --silent --show-error \
            -X POST \
            -F 'message=📅 This week’s Space Coast tech events are live! Browse local events and add them to your calendar.' \
            -F "link=$POST_URL" \
            -F "access_token=$FACEBOOK_PAGE_ACCESS_TOKEN" \
            "https://graph.facebook.com/$FACEBOOK_PAGE_ID/feed"

      - name: Post to Bluesky
        id: post-bluesky
        if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'bluesky'
        continue-on-error: true
        env:
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          POST_URL: ${{ steps.post.outputs.url }}
        run: |
          if [ -z "$BLUESKY_APP_PASSWORD" ] || [ -z "$BLUESKY_HANDLE" ]; then
            echo "Bluesky posting is not configured; skipping."
            exit 0
          fi

          session_payload="$(jq -nc --arg identifier "$BLUESKY_HANDLE" --arg password "$BLUESKY_APP_PASSWORD" '{identifier: $identifier, password: $password}')"
          access_jwt="$(curl --fail-with-body --silent --show-error \
            -X POST \
            -H 'Content-Type: application/json' \
            --data "$session_payload" \
            'https://bsky.social/xrpc/com.atproto.server.createSession' | jq -er '.accessJwt')"
          message=$'📅 This week’s Space Coast tech events are live!\n\n'"$POST_URL"
          post_payload="$(jq -nc --arg repo "$BLUESKY_HANDLE" --arg text "$message" --arg url "$POST_URL" '{
            repo: $repo,
            collection: "app.bsky.feed.post",
            record: {
              text: $text,
              facets: [{
                index: {
                  byteStart: ($text | split($url)[0] | utf8bytelength),
                  byteEnd: ($text | utf8bytelength)
                },
                features: [{
                  "$type": "app.bsky.richtext.facet#link",
                  uri: $url
                }]
              }],
              createdAt: (now | todateiso8601)
            }
          }')"

          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $access_jwt" \
            -H 'Content-Type: application/json' \
            --data "$post_payload" \
            'https://bsky.social/xrpc/com.atproto.repo.createRecord'

      - name: Post to X
        id: post-x
        if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'x'
        continue-on-error: true
        env:
          POST_URL: ${{ steps.post.outputs.url }}
          X_USER_ACCESS_TOKEN: ${{ secrets.X_USER_ACCESS_TOKEN }}
        run: |
          if [ -z "$X_USER_ACCESS_TOKEN" ]; then
            echo "X posting is not configured; skipping."
            exit 0
          fi

          payload="$(jq -nc --arg url "$POST_URL" '{
            text: "📅 This week’s Space Coast tech events are live! Browse local events and add them to your calendar: \($url)"
          }')"

          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $X_USER_ACCESS_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            'https://api.x.com/2/tweets'

      - name: Post to Discord local events channel
        id: post-discord
        if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'discord'
        continue-on-error: true
        env:
          DISCORD_LOCAL_EVENTS_WEBHOOK_URL: ${{ secrets.DISCORD_LOCAL_EVENTS_WEBHOOK_URL }}
          POST_URL: ${{ steps.post.outputs.url }}
        run: |
          if [ -z "$DISCORD_LOCAL_EVENTS_WEBHOOK_URL" ]; then
            echo "DISCORD_LOCAL_EVENTS_WEBHOOK_URL is not configured." >&2
            exit 1
          fi

          payload="$(jq -nc --arg url "$POST_URL" '{
            content: "📅 **This week’s Space Coast tech events are live!**\n\($url)",
            embeds: [{
              title: "Weekly Space Coast Tech Events",
              url: $url,
              description: "Browse local events, see details, and add them to your calendar.",
              color: 6225920
            }]
          }')"

          curl --fail-with-body --silent --show-error \
            -X POST \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "$DISCORD_LOCAL_EVENTS_WEBHOOK_URL"

      - name: Report announcement failures
        if: always()
        env:
          FACEBOOK_OUTCOME: ${{ steps.post-facebook.outcome }}
          BLUESKY_OUTCOME: ${{ steps.post-bluesky.outcome }}
          X_OUTCOME: ${{ steps.post-x.outcome }}
          DISCORD_OUTCOME: ${{ steps.post-discord.outcome }}
        run: |
          failed_targets=()

          [ "$FACEBOOK_OUTCOME" = "failure" ] && failed_targets+=("Facebook")
          [ "$BLUESKY_OUTCOME" = "failure" ] && failed_targets+=("Bluesky")
          [ "$X_OUTCOME" = "failure" ] && failed_targets+=("X")
          [ "$DISCORD_OUTCOME" = "failure" ] && failed_targets+=("Discord")

          if [ "${#failed_targets[@]}" -gt 0 ]; then
            echo "Announcement failed for: ${failed_targets[*]}" >&2
            exit 1
          fi

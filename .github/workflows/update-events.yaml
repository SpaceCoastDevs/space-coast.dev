name: Update Space Coast Events

on:
  schedule:
    # Runs 3 days before month start window (UTC)
    - cron: "0 15 28-30 * *"
  workflow_dispatch:
    inputs:
      target_month:
        description: 'Month to generate, in YYYY-MM format (defaults to next month)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-events:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout site repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout EvntHndlr tool
        uses: actions/checkout@v4
        with:
          repository: SpaceCoastDevs/EvntHndlr
          path: tools/evnthndlr

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tools/evnthndlr/package-lock.json

      - name: Install and build tool
        run: |
          cd tools/evnthndlr
          npm ci
          npm run build

      - name: Compute target month
        run: |
          TARGET_MONTH="${{ inputs.target_month }}"
          if [ -z "$TARGET_MONTH" ]; then
            TARGET_MONTH="$(date -u -d '+1 month' +%Y-%m)"
          fi
          if ! [[ "$TARGET_MONTH" =~ ^[0-9]{4}-(0[1-9]|1[0-2])$ ]]; then
            echo "target_month must use YYYY-MM format" >&2
            exit 1
          fi
          echo "TARGET_MONTH=$TARGET_MONTH" >> $GITHUB_ENV
          echo "TARGET_FILE=src/content/post/space-coast-tech-events-$TARGET_MONTH.mdx" >> $GITHUB_ENV

      - name: Generate markdown into site repo
        run: |
          node tools/evnthndlr/dist/generate.js --month="${TARGET_MONTH}" --file="${TARGET_FILE}"

      - name: Create or update PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          add-paths: ${{ env.TARGET_FILE }}
          commit-message: "Update events for ${{ env.TARGET_MONTH }}"
          title: "Update Space Coast Tech Events for ${{ env.TARGET_MONTH }}"
          body: |
            Automated monthly event content refresh.
            Target month: ${{ env.TARGET_MONTH }}
          branch: "automation/events-${{ env.TARGET_MONTH }}"
          delete-branch: true

name: Update Space Coast Events

on:
  schedule:
    # Every Sunday night at 03:00 UTC Monday (11:00 PM EDT / 10:00 PM EST).
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      target_month:
        description: 'Month to refresh, in YYYY-MM format (defaults to the current month)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-events:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout site repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout EvntHndlr tool
        uses: actions/checkout@v4
        with:
          repository: SpaceCoastDevs/EvntHndlr
          path: tools/evnthndlr

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/evnthndlr/package-lock.json

      - name: Install and build tool
        run: |
          cd tools/evnthndlr
          npm ci
          npm run build

      - name: Install site dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Compute target months
        run: |
          TARGET_MONTH="${{ inputs.target_month }}"
          if [ -z "$TARGET_MONTH" ]; then
            TARGET_MONTH="$(date -u +%Y-%m)"
          fi
          if ! [[ "$TARGET_MONTH" =~ ^[0-9]{4}-(0[1-9]|1[0-2])$ ]]; then
            echo "target_month must use YYYY-MM format" >&2
            exit 1
          fi
          NEXT_MONTH="$(date -u -d "${TARGET_MONTH}-01 +1 month" +%Y-%m)"
          echo "TARGET_MONTH=$TARGET_MONTH" >> $GITHUB_ENV
          echo "NEXT_MONTH=$NEXT_MONTH" >> $GITHUB_ENV
          echo "EVENTS_DIR=src/content/event" >> $GITHUB_ENV

      - name: Refresh structured event records
        run: |
          node tools/evnthndlr/dist/generate.js --month="${TARGET_MONTH}" --event-dir="${EVENTS_DIR}" --no-markdown
          node tools/evnthndlr/dist/generate.js --month="${NEXT_MONTH}" --event-dir="${EVENTS_DIR}" --no-markdown
          pnpm run cache:event-images
          pnpm run generate:event-images
          pnpm exec prettier --write "$EVENTS_DIR"

      - name: Create weekly event post
        run: |
          RUN_DATE="$(date -u +%Y-%m-%d)"
          RUN_DAY="$(date -u +%u)"
          POST_DATE="$(date -u -d "${RUN_DATE} - $((RUN_DAY - 1)) days" +%Y-%m-%d)"
          WEEK_END="$(date -u -d "${POST_DATE} + 6 days" +%Y-%m-%d)"
          POST_FILE="src/content/post/${POST_DATE}-weekly-space-coast-tech-events.mdx"

          cat > "$POST_FILE" <<EOF
          ---
          publishDate: ${POST_DATE}T00:00:00Z
          title: Weekly Space Coast "Tech" Events for ${POST_DATE} - ${WEEK_END}
          excerpt: This week's technology events around the Space Coast.
          category: Events
          tags:
            - meetups
            - events
          slug: ${POST_DATE}-weekly-space-coast-tech-events
          permalink: posts/${POST_DATE}/weekly-space-coast-tech-events
          image: ~/assets/images/space-coast-devs-events.png
          ---

          import EventList from '~/components/events/EventList.astro';

          ## This week's events

          This roundup updates weekly. Select an event below for its location, source link, and calendar download. For other upcoming events, browse the [full event directory](/events).

          <EventList weekOf="${POST_DATE}" />
          EOF

          pnpm exec prettier --write "$POST_FILE"

      - name: Create or update PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          add-paths: |
            ${{ env.EVENTS_DIR }}/**
            public/event-images/**
            src/content/post/*-weekly-space-coast-tech-events.mdx
          commit-message: "Update event records for ${{ env.TARGET_MONTH }}"
          title: "Update Space Coast event records for ${{ env.TARGET_MONTH }}"
          body: |
            Automated weekly event record refresh.
            Refreshed months: ${{ env.TARGET_MONTH }} and ${{ env.NEXT_MONTH }}.
          branch: "automation/events-${{ env.TARGET_MONTH }}"
          delete-branch: true
